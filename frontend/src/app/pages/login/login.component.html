<div class="main">
    <div class="left">
        <div class="titleContainer">
            <div class="logo">
                <img src="/img/logo.png" alt="logo image" (click)="onClick()">
            </div>
            <div class="title">Futur Immobilier</div>
        </div>
        <div class="login">
            <div class="loginTitle">Connectez-vous pour continuer</div>
            <div class="loginContainer">
                <button class="loginButton" (click)="login()">
                    <img src="/img/google.png" alt="google logo">
                    Se connecter avec Google
                </button>
            </div>
        </div>
    </div>
    <div class="right">
        <img src="/img/loginImage.png" alt="login image">
    </div>
</div>
