<div class="main">
    <div class="header">
        <app-header (menuClicked)="onHeaderMenuClick()" (connectedUser)="OnUserConnected($event)"></app-header>
    </div>
    <div class="title">
        Vos annonces favorites
    </div>
    <div class="searchMenu">
        <app-search-bar></app-search-bar>
    </div>
        <div class="cardsContainer">
        @if (appartments.length > 0) {
            @for (item of appartments; track $index) {
                <div class="cards">
                    <app-small-card 
                        [newId]="item.id!"
                        [newTitle]="item.title!"
                        [newPrice]="item.prix!"
                        [newLocation]="item.ville!"
                        [newImg]="item.images![0]"
                        (isItemAddedToFavorite)="OnItemAddedToFavorite($event)"
                    />
                </div>
            }
        }
    </div>
    <div class="footer">
        <app-footer></app-footer>
    </div>

    @if (isMenuOpen) {
        <div class="menu">
            <app-menu (closeMenu)="onMenuCloseClick()"/>
        </div>
    }
</div>
